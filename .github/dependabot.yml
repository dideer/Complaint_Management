version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - owner
    assignees:
      - owner
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: "chore"
      prefix-scope: "deps"
      include: "scope"
    allow:
      - dependency-type: all
    ignore:
      - dependency-name: "eslint"
        versions: ["8.x"]
