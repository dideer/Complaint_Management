name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '18'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== CODE ANALYSIS ====================
  codeql-analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  lint-and-quality:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
        continue-on-error: false
      
      - name: Generate ESLint report
        run: npm run lint:report
        if: always()
      
      - name: Upload ESLint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 30
          compression-level: 9

  # ==================== SECURITY SCANNING ====================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: npm run security:audit
        continue-on-error: true
      
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --json-file-output=snyk-results.json
        continue-on-error: true
        if: env.SNYK_TOKEN != ''
      
      - name: Upload Snyk results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: snyk-results.json
          retention-days: 30
          compression-level: 9

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check for outdated packages
        run: npm outdated || true
      
      - name: Generate SBOM
        run: |
          npm ls --json > sbom.json 2>&1 || true
      
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: sbom.json
          retention-days: 30

  # ==================== BUILD & TEST ====================
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [codeql-analyze, lint-and-quality, security-scan, dependency-check]
    permissions:
      contents: read
      checks: write
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: complaints_db_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        run: npm run test:unit
      
      - name: Run integration tests
        run: npm run test:integration
        env:
          DB_HOST: localhost
          DB_USER: root
          DB_PASSWORD: password
          DB_NAME: complaints_db_test
      
      - name: Generate coverage report
        run: npm run coverage:report
        if: always()
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
        if: always()
      
      - name: Archive test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: coverage/
          retention-days: 30
          compression-level: 9
      
      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              const coverage = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8'));
              const total = coverage.total;
              
              const comment = `## 📊 Test Results
              
              | Metric | Coverage |
              |--------|----------|
              | Lines | ${total.lines.pct}% |
              | Statements | ${total.statements.pct}% |
              | Functions | ${total.functions.pct}% |
              | Branches | ${total.branches.pct}% |
              
              ✅ All tests passed!`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Could not parse coverage report:', error);
            }

  # ==================== PERFORMANCE TESTING ====================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: complaints_db_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run performance tests
        run: npm run test:integration -- --testNamePattern="concurrent"
        env:
          DB_HOST: localhost
          DB_USER: root
          DB_PASSWORD: password
          DB_NAME: complaints_db_test
      
      - name: Upload performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: coverage/
          retention-days: 30
          compression-level: 9

  # ==================== CODE QUALITY METRICS ====================
  quality-metrics:
    name: Code Quality Metrics
    runs-on: ubuntu-latest
    needs: [lint-and-quality, build-test]
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate code metrics
        run: |
          npm run coverage:report
          npm run lint:report || true
      
      - name: Upload metrics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-metrics
          path: |
            coverage/
            eslint-report.json
          retention-days: 30
      
      - name: Comment PR with metrics
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              const eslint = JSON.parse(fs.readFileSync('./eslint-report.json', 'utf8'));
              const issues = eslint.reduce((acc, file) => acc + file.messages.length, 0);
              
              const comment = `## 🔍 Code Quality Metrics
              
              - ESLint Issues: ${issues}
              - Quality Check: ${issues === 0 ? '✅ Passed' : '⚠️ Failed'}`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Could not parse metrics:', error);
            }

  # ==================== DOCKER BUILD ====================
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build-test, performance-tests, quality-metrics]
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name != 'pull_request'
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Scan Docker image
        run: |
          echo "Docker image built successfully"
        if: always()

  # ==================== NOTIFICATIONS ====================
  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [codeql-analyze, lint-and-quality, security-scan, dependency-check, build-test, performance-tests, quality-metrics, docker-build]
    if: always()
    permissions:
      contents: read
    
    steps:
      - name: Determine build status
        id: status
        run: |
          if [ "${{ needs.codeql-analyze.result }}" = "failure" ] || \
             [ "${{ needs.lint-and-quality.result }}" = "failure" ] || \
             [ "${{ needs.security-scan.result }}" = "failure" ] || \
             [ "${{ needs.build-test.result }}" = "failure" ] || \
             [ "${{ needs.performance-tests.result }}" = "failure" ] || \
             [ "${{ needs.quality-metrics.result }}" = "failure" ] || \
             [ "${{ needs.docker-build.result }}" = "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          fi
      
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "title": "Build ${{ steps.status.outputs.status }}",
                  "title_link": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  "text": "${{ steps.status.outputs.emoji }} Build #${{ github.run_number }} - ${{ github.ref_name }}",
                  "fields": [
                    {
                      "title": "Repository",
                      "value": "${{ github.repository }}",
                      "short": true
                    },
                    {
                      "title": "Commit",
                      "value": "${{ github.sha }}",
                      "short": true
                    },
                    {
                      "title": "Author",
                      "value": "${{ github.actor }}",
                      "short": true
                    },
                    {
                      "title": "Branch",
                      "value": "${{ github.ref_name }}",
                      "short": true
                    }
                  ]
                }
              ]
            }
        if: always() && env.SLACK_WEBHOOK != ''
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v3
        if: failure() && env.NOTIFICATION_EMAIL != ''
        with:
          server_address: ${{ secrets.EMAIL_SERVER }}
          server_port: ${{ secrets.EMAIL_PORT }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Build Failed - ${{ github.repository }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: GitHub Actions
          body: |
            Build #${{ github.run_number }} failed!
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            
            View details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true
        env:
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}

  # ==================== BUILD SUMMARY ====================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [codeql-analyze, lint-and-quality, security-scan, dependency-check, build-test, performance-tests, quality-metrics, docker-build, notify]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Generate build summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const jobs = {
              'CodeQL': '${{ needs.codeql-analyze.result }}',
              'Lint': '${{ needs.lint-and-quality.result }}',
              'Security': '${{ needs.security-scan.result }}',
              'Dependencies': '${{ needs.dependency-check.result }}',
              'Tests': '${{ needs.build-test.result }}',
              'Performance': '${{ needs.performance-tests.result }}',
              'Metrics': '${{ needs.quality-metrics.result }}',
              'Docker': '${{ needs.docker-build.result }}'
            };
            
            let summary = '## 📋 CI/CD Pipeline Summary\n\n';
            summary += '| Stage | Status |\n';
            summary += '|-------|--------|\n';
            
            Object.entries(jobs).forEach(([name, status]) => {
              const icon = status === 'success' ? '✅' : status === 'failure' ? '❌' : '⏭️';
              summary += `| ${name} | ${icon} ${status} |\n`;
            });
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
      
      - name: Print summary to console
        run: |
          echo "=== CI/CD Pipeline Summary ==="
          echo "CodeQL:       ${{ needs.codeql-analyze.result }}"
          echo "Lint:         ${{ needs.lint-and-quality.result }}"
          echo "Security:     ${{ needs.security-scan.result }}"
          echo "Dependencies: ${{ needs.dependency-check.result }}"
          echo "Tests:        ${{ needs.build-test.result }}"
          echo "Performance:  ${{ needs.performance-tests.result }}"
          echo "Metrics:      ${{ needs.quality-metrics.result }}"
          echo "Docker:       ${{ needs.docker-build.result }}"
